name: Brand guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/test-check-brand.sh
      - run: ./scripts/check-brand.sh
      - run: ./scripts/test-check-legacy-machine-inventory.sh
      - run: ./scripts/test-open-core-policy.sh
      - run: ./scripts/test-check-module-boundary.sh
