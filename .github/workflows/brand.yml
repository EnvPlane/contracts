name: Brand guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./scripts/test-check-brand.sh
      - name: Check new human-readable brand usage
        run: ./scripts/check-brand.sh --diff-base
      - run: ./scripts/test-check-legacy-machine-inventory.sh
      - run: ./scripts/check-legacy-machine-inventory.sh --scan-root .
      - run: ./scripts/test-open-core-policy.sh
      - run: ./scripts/test-check-module-boundary.sh
