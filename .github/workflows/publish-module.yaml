name: Publish Go module version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contracts-module-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'EnvPlane/contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure Go toolchain
        run: |
          GO_VERSION_FILE=go.mod \
          ./scripts/ensure-go.sh
      - name: Select module Go toolchain
        run: echo "GOTOOLCHAIN=go$(awk '/^go[[:space:]]/ {print $2; exit}' go.mod)" >> "$GITHUB_ENV"
      - name: Verify module before publication
        run: go test ./...
      - id: version
        name: Allocate next patch version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)"
          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - name: Publish immutable Go module tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "envplane automation"
          git config user.email "automation@envplane.dev"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            existing_commit="$(git rev-parse "$TAG^{commit}")"
            current_commit="$(git rev-parse HEAD)"
            if [[ "$existing_commit" != "$current_commit" ]]; then
              echo "tag $TAG already exists on a different commit" >&2
              exit 1
            fi
            echo "tag $TAG already points at HEAD; nothing to publish"
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
