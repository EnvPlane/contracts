name: Publish Go module version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contracts-module-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'EnvPlane/contracts' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      REPOSITORY: ${{ github.repository }}
      EVENT_REF: ${{ github.ref }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Test release classifier and immutable publication
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_module_publication.py' -v
      - id: changes
        name: Classify changes since latest immutable release
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --tags
          python3 scripts/module_publication.py classify \
            --event "$EVENT_NAME" --repository "$REPOSITORY" \
            --ref "$EVENT_REF" --commit "$COMMIT_SHA" \
            --current-main "$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"
      - name: Ensure Go toolchain
        if: steps.changes.outputs.publish == 'true'
        run: |
          GO_VERSION_FILE=go.mod \
          ./scripts/ensure-go.sh
      - name: Select module Go toolchain
        if: steps.changes.outputs.publish == 'true'
        run: echo "GOTOOLCHAIN=go$(awk '/^go[[:space:]]/ {print $2; exit}' go.mod)" >> "$GITHUB_ENV"
      - name: Verify module before publication
        if: steps.changes.outputs.publish == 'true'
        run: GOWORK=off go test -race ./...
      - name: Verify module builds outside any workspace
        if: steps.changes.outputs.publish == 'true'
        run: GOWORK=off go build ./...
      - name: Publish immutable Go module tag
        if: steps.changes.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python3 scripts/module_publication.py publish \
            --event "$EVENT_NAME" --repository "$REPOSITORY" \
            --ref "$EVENT_REF" --commit "$COMMIT_SHA"
